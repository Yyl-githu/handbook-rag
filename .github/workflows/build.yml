name: Build
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Vue build writes into src/main/resources/static, which is not committed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # Tests are skipped on purpose: the only test calls a real model endpoint and
      # needs a live PostgreSQL. Set up a key and a database to run them locally.
      - name: Build jar
        run: |
          chmod +x ./mvnw
          ./mvnw -B -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: spring-ai-rag-demo-jar
          path: target/*.jar
          retention-days: 7