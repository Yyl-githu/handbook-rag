<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 · 学生手册问答</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(900px 500px at 50% 0%, #16233a 0%, #0b1220 60%);
        color: #e8eef8;
        font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      .card {
        width: min(360px, calc(100vw - 32px));
        background: #121c2e; border: 1px solid #22314c; border-radius: 16px;
        padding: 28px 26px; box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
      }
      h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
      p.sub { margin: 0 0 22px; color: #8fa3bf; font-size: 12.5px; }
      label { display: block; font-size: 12.5px; color: #8fa3bf; margin: 14px 0 6px; }
      input {
        width: 100%; padding: 10px 12px; border-radius: 9px; font: inherit;
        background: #0d1626; border: 1px solid #22314c; color: #e8eef8; outline: none;
      }
      input:focus { border-color: #35507d; }
      button {
        width: 100%; margin-top: 22px; padding: 11px; border: 0; border-radius: 10px;
        background: #4f8cff; color: #fff; font: inherit; font-weight: 500; cursor: pointer;
      }
      button:hover { background: #3f7cf0; }
      .error {
        margin-top: 16px; padding: 9px 12px; border-radius: 9px; font-size: 13px;
        background: #2a1414; border: 1px solid #6a2a2a; color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <form class="card" method="post" action="/login">
      <h1>学生手册问答</h1>
      <p class="sub">贵州财经大学 · 需要登录后使用</p>

      <label for="username">账号</label>
      <input id="username" name="username" autocomplete="username" autofocus required />

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit">登录</button>

      <div class="error" id="err" hidden>账号或密码不正确。</div>
    </form>

    <script>
      if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('err').hidden = false;
      }
    </script>
  </body>
</html>
